<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HerramientasGratis 6.0</title>

<meta name="description" content="HerramientasGratis - herramientas online gratuitas, rápidas y fáciles de usar.">
<meta name="theme-color" content="#2563eb">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#f4f7fb;
    --card:#ffffff;
    --text:#172033;
    --muted:#64748b;
    --primary:#2563eb;
    --primary-dark:#1d4ed8;
    --border:#e2e8f0;
    --success:#16a34a;
    --danger:#dc2626;
    --shadow:0 10px 30px rgba(15,23,42,.08);
}

body.dark{
    --bg:#0f172a;
    --card:#1e293b;
    --text:#f8fafc;
    --muted:#94a3b8;
    --border:#334155;
    --shadow:0 10px 30px rgba(0,0,0,.25);
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    transition:.25s;
}

button,input,textarea,select{
    font:inherit;
}

button{
    cursor:pointer;
}

header{
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    color:white;
    padding:18px 20px;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.header-content{
    max-width:1200px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.logo span{
    color:#facc15;
}

.header-actions{
    display:flex;
    gap:8px;
}

.icon-btn{
    border:0;
    background:rgba(255,255,255,.18);
    color:white;
    width:42px;
    height:42px;
    border-radius:12px;
    font-size:20px;
}

.hero{
    max-width:1100px;
    margin:40px auto 25px;
    padding:20px;
    text-align:center;
}

.hero h1{
    font-size:42px;
    margin-bottom:12px;
}

.hero h1 span{
    color:var(--primary);
}

.hero p{
    color:var(--muted);
    font-size:18px;
    margin-bottom:25px;
}

.search-box{
    max-width:650px;
    margin:auto;
    position:relative;
}

.search-box input{
    width:100%;
    padding:17px 50px 17px 20px;
    border:2px solid var(--border);
    border-radius:15px;
    outline:none;
    background:var(--card);
    color:var(--text);
    font-size:16px;
}

.search-box input:focus{
    border-color:var(--primary);
}

.search-icon{
    position:absolute;
    right:18px;
    top:50%;
    transform:translateY(-50%);
    font-size:21px;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:0 20px 50px;
}

.categories{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:5px 0 20px;
}

.category-btn{
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    padding:10px 17px;
    border-radius:30px;
    white-space:nowrap;
}

.category-btn.active,
.category-btn:hover{
    background:var(--primary);
    color:white;
    border-color:var(--primary);
}

.section-title{
    margin:25px 0 18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.section-title h2{
    font-size:25px;
}

.tool-count{
    color:var(--muted);
    font-size:14px;
}

.tools-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.tool-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:20px;
    box-shadow:var(--shadow);
    transition:.2s;
    position:relative;
}

.tool-card:hover{
    transform:translateY(-4px);
}

.tool-top{
    display:flex;
    align-items:center;
    gap:13px;
    margin-bottom:12px;
}

.tool-icon{
    width:48px;
    height:48px;
    border-radius:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#eff6ff;
    font-size:25px;
}

body.dark .tool-icon{
    background:#172554;
}

.tool-name{
    font-size:18px;
    font-weight:bold;
}

.tool-description{
    color:var(--muted);
    font-size:14px;
    line-height:1.5;
    min-height:42px;
}

.tool-actions{
    display:flex;
    gap:8px;
    margin-top:16px;
}

.primary-btn,
.secondary-btn,
.danger-btn{
    border:0;
    padding:10px 14px;
    border-radius:10px;
    font-weight:bold;
}

.primary-btn{
    background:var(--primary);
    color:white;
}

.primary-btn:hover{
    background:var(--primary-dark);
}

.secondary-btn{
    background:#e2e8f0;
    color:#172033;
}

body.dark .secondary-btn{
    background:#334155;
    color:white;
}

.danger-btn{
    background:#fee2e2;
    color:#b91c1c;
}

.favorite{
    position:absolute;
    top:18px;
    right:18px;
    background:none;
    border:0;
    font-size:23px;
}

.favorite.active{
    color:#f59e0b;
}

.empty{
    text-align:center;
    padding:50px 20px;
    color:var(--muted);
    display:none;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:2000;
}

.modal.show{
    display:flex;
}

.modal-box{
    background:var(--card);
    width:100%;
    max-width:650px;
    max-height:90vh;
    overflow:auto;
    border-radius:20px;
    padding:25px;
    position:relative;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.close{
    border:0;
    background:none;
    font-size:27px;
    color:var(--text);
}

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;
    padding:12px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--bg);
    color:var(--text);
    outline:none;
}

.form-group textarea{
    min-height:130px;
    resize:vertical;
}

.result{
    margin-top:18px;
    padding:16px;
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:12px;
    word-break:break-word;
}

.result.big{
    font-size:30px;
    text-align:center;
    font-weight:bold;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.button-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:12px;
}

.calc{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.calc-display{
    width:100%;
    padding:18px;
    font-size:26px;
    text-align:right;
    border:1px solid var(--border);
    border-radius:12px;
    background:var(--bg);
    color:var(--text);
    margin-bottom:10px;
}

.calc button{
    padding:16px 5px;
    border:0;
    border-radius:10px;
    background:#e2e8f0;
    color:#172033;
    font-weight:bold;
}

body.dark .calc button{
    background:#334155;
    color:white;
}

.calc .operator{
    background:var(--primary);
    color:white;
}

.timer{
    font-size:55px;
    text-align:center;
    font-weight:bold;
    margin:20px 0;
}

.color-preview{
    height:100px;
    border-radius:15px;
    margin-top:15px;
    border:1px solid var(--border);
}

footer{
    background:#0f172a;
    color:#cbd5e1;
    text-align:center;
    padding:30px 20px;
    margin-top:30px;
}

footer strong{
    color:white;
}

.toast{
    position:fixed;
    bottom:25px;
    right:25px;
    background:#172033;
    color:white;
    padding:13px 18px;
    border-radius:10px;
    opacity:0;
    transform:translateY(20px);
    transition:.3s;
    z-index:5000;
}

.toast.show{
    opacity:1;
    transform:translateY(0);
}

@media(max-width:900px){
    .tools-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:600px){
    .header-content{
        flex-direction:row;
    }

    .logo{
        font-size:20px;
    }

    .hero{
        margin-top:25px;
    }

    .hero h1{
        font-size:31px;
    }

    .hero p{
        font-size:15px;
    }

    .tools-grid{
        grid-template-columns:1fr;
    }

    .row{
        grid-template-columns:1fr;
    }

    .modal-box{
        padding:18px;
    }
}
</style>
</head>

<body>

<header>
<div class="header-content">

<div class="logo">
🛠️ Herramientas<span>Gratis</span>
</div>

<div class="header-actions">
<button class="icon-btn" onclick="toggleDark()" title="Modo oscuro">🌙</button>
<button class="icon-btn" onclick="showFavorites()" title="Favoritos">⭐</button>
</div>

</div>
</header>

<section class="hero">

<h1>Tus herramientas <span>gratis</span> en un solo lugar</h1>

<p>Rápidas, fáciles y sin registros.</p>

<div class="search-box">
<input
type="text"
id="search"
placeholder="Buscar una herramienta..."
oninput="searchTools()">
<span class="search-icon">🔎</span>
</div>

</section>

<main class="container">

<div class="categories">

<button class="category-btn active" onclick="filterCategory('Todas',this)">Todas</button>
<button class="category-btn" onclick="filterCategory('Texto',this)">📝 Texto</button>
<button class="category-btn" onclick="filterCategory('Calculadoras',this)">🧮 Calculadoras</button>
<button class="category-btn" onclick="filterCategory('Productividad',this)">⚡ Productividad</button>
<button class="category-btn" onclick="filterCategory('Seguridad',this)">🔐 Seguridad</button>
<button class="category-btn" onclick="filterCategory('Conversores',this)">🔄 Conversores</button>
<button class="category-btn" onclick="filterCategory('Tiempo',this)">⏱️ Tiempo</button>
</div>

<div class="section-title">
<h2>Herramientas</h2>
<span class="tool-count" id="toolCount"></span>
</div>

<div class="tools-grid" id="toolsGrid"></div>

<div class="empty" id="empty">
<h2>😕 No encontramos herramientas</h2>
<p>Prueba con otro término de búsqueda.</p>
</div>

</main>

<footer>
<p><strong>HerramientasGratis 6.0</strong></p>
<p>Herramientas online gratuitas para todos.</p>
<p style="margin-top:10px;">© 2026 HerramientasGratis</p>
</footer>

<div class="modal" id="modal">

<div class="modal-box">

<div class="modal-header">
<h2 id="modalTitle"></h2>
<button class="close" onclick="closeModal()">✕</button>
</div>

<div id="modalContent"></div>

</div>
</div>

<div class="toast" id="toast"></div>

<script>

const tools = [

{
id:"calculadora",
name:"Calculadora",
icon:"🧮",
category:"Calculadoras",
description:"Realiza operaciones matemáticas rápidamente.",
action:calculator
},

{
id:"porcentaje",
name:"Calculadora de porcentaje",
icon:"📊",
category:"Calculadoras",
description:"Calcula porcentajes de manera sencilla.",
action:percentage
},

{
id:"descuento",
name:"Calculadora de descuentos",
icon:"💰",
category:"Calculadoras",
description:"Calcula cuánto pagarás después de un descuento.",
action:discount
},

{
id:"edad",
name:"Calculadora de edad",
icon:"🎂",
category:"Calculadoras",
description:"Calcula tu edad exacta.",
action:ageCalculator
},

{
id:"contador",
name:"Contador de palabras",
icon:"📝",
category:"Texto",
description:"Cuenta palabras, caracteres y líneas.",
action:wordCounter
},

{
id:"mayusculas",
name:"Mayúsculas y minúsculas",
icon:"🔤",
category:"Texto",
description:"Convierte texto entre mayúsculas y minúsculas.",
action:textCase
},

{
id:"limpiar",
name:"Limpiar texto",
icon:"🧹",
category:"Texto",
description:"Elimina espacios y líneas innecesarias.",
action:cleanText
},

{
id:"copiar",
name:"Copiar texto",
icon:"📋",
category:"Texto",
description:"Escribe texto y cópialo rápidamente.",
action:copyTool
},

{
id:"password",
name:"Generador de contraseñas",
icon:"🔐",
category:"Seguridad",
description:"Crea contraseñas seguras y aleatorias.",
action:passwordGenerator
},

{
id:"random",
name:"Número aleatorio",
icon:"🎲",
category:"Productividad",
description:"Genera números aleatorios.",
action:randomNumber
},

{
id:"url",
name:"Codificador de URL",
icon:"🔗",
category:"Productividad",
description:"Codifica y decodifica textos para URLs.",
action:urlEncoder
},

{
id:"color",
name:"Selector de colores",
icon:"🎨",
category:"Productividad",
description:"Elige un color y obtén su código HEX.",
action:colorPicker
},

{
id:"temperatura",
name:"Conversor de temperatura",
icon:"🌡️",
category:"Conversores",
description:"Convierte Celsius, Fahrenheit y Kelvin.",
action:temperature
},

{
id:"unidades",
name:"Conversor de unidades",
icon:"📏",
category:"Conversores",
description:"Convierte kilómetros, metros, millas y más.",
action:units
},

{
id:"cronometro",
name:"Cronómetro",
icon:"⏱️",
category:"Tiempo",
description:"Cronómetro online sencillo.",
action:stopwatch
},

{
id:"temporizador",
name:"Temporizador",
icon:"⏲️",
category:"Tiempo",
description:"Cuenta regresiva personalizada.",
action:timer
}

];

let currentCategory="Todas";
let favorites=JSON.parse(localStorage.getItem("hgFavorites")||"[]");

function saveFavorites(){
localStorage.setItem("hgFavorites",JSON.stringify(favorites));
}

function isFavorite(id){
return favorites.includes(id);
}

function toggleFavorite(id,event){
if(event) event.stopPropagation();

if(isFavorite(id)){
favorites=favorites.filter(x=>x!==id);
showToast("Eliminado de favoritos");
}else{
favorites.push(id);
showToast("⭐ Añadido a favoritos");
}

saveFavorites();
renderTools();
}

function renderTools(){

const grid=document.getElementById("toolsGrid");
const search=document.getElementById("search").value.toLowerCase();

let filtered=tools.filter(tool=>{

const categoryOK=
currentCategory==="Todas" ||
tool.category===currentCategory;

const searchOK=
tool.name.toLowerCase().includes(search) ||
tool.description.toLowerCase().includes(search) ||
tool.category.toLowerCase().includes(search);

return categoryOK && searchOK;
});

grid.innerHTML="";

filtered.forEach(tool=>{

const card=document.createElement("div");
card.className="tool-card";

card.innerHTML=`

<button
class="favorite ${isFavorite(tool.id)?"active":""}"
onclick="toggleFavorite('${tool.id}',event)"
title="Favorito">
${isFavorite(tool.id)?"★":"☆"}
</button>

<div class="tool-top">

<div class="tool-icon">${tool.icon}</div>

<div>
<div class="tool-name">${tool.name}</div>
<small style="color:var(--muted)">${tool.category}</small>
</div>

</div>

<p class="tool-description">
${tool.description}
</p>

<div class="tool-actions">

<button class="primary-btn"
onclick="openTool('${tool.id}')">
Abrir herramienta
</button>

</div>
`;

grid.appendChild(card);

});

document.getElementById("toolCount").textContent=
filtered.length+" herramientas";

document.getElementById("empty").style.display=
filtered.length?"none":"block";

}

function openTool(id){

const tool=tools.find(x=>x.id===id);

if(!tool)return;

document.getElementById("modalTitle").textContent=
tool.icon+" "+tool.name;

document.getElementById("modalContent").innerHTML="";

tool.action();

document.getElementById("modal").classList.add("show");
}

function closeModal(){
document.getElementById("modal").classList.remove("show");
}

document.getElementById("modal").addEventListener("click",function(e){

if(e.target===this){
closeModal();
}

});

function filterCategory(category,button){

currentCategory=category;

document.querySelectorAll(".category-btn")
.forEach(x=>x.classList.remove("active"));

button.classList.add("active");

renderTools();

}

function searchTools(){
renderTools();
}

function showFavorites(){

currentCategory="Todas";

document.querySelectorAll(".category-btn")
.forEach(x=>x.classList.remove("active"));

document.querySelector(".category-btn").classList.add("active");

const grid=document.getElementById("toolsGrid");

const favTools=tools.filter(x=>favorites.includes(x.id));

grid.innerHTML="";

favTools.forEach(tool=>{

const card=document.createElement("div");

card.className="tool-card";

card.innerHTML=`

<button
class="favorite active"
onclick="toggleFavorite('${tool.id}',event)">
★
</button>

<div class="tool-top">

<div class="tool-icon">${tool.icon}</div>

<div>
<div class="tool-name">${tool.name}</div>
<small style="color:var(--muted)">${tool.category}</small>
</div>

</div>

<p class="tool-description">
${tool.description}
</p>

<div class="tool-actions">

<button class="primary-btn"
onclick="openTool('${tool.id}')">
Abrir herramienta
</button>

</div>
`;

grid.appendChild(card);

});

document.getElementById("toolCount").textContent=
favTools.length+" favoritos";

document.getElementById("empty").style.display=
favTools.length?"none":"block";

if(!favTools.length){

document.getElementById("empty").innerHTML=`
<h2>⭐ No tienes favoritos todavía</h2>
<p>Presiona la estrella de una herramienta para guardarla.</p>
`;

}

window.scrollTo({
top:document.querySelector(".container").offsetTop-80,
behavior:"smooth"
});

}

function showToast(message){

const toast=document.getElementById("toast");

toast.textContent=message;

toast.classList.add("show");

setTimeout(()=>{
toast.classList.remove("show");
},2000);

}

function toggleDark(){

document.body.classList.toggle("dark");

localStorage.setItem(
"hgDark",
document.body.classList.contains("dark")
);

}

if(localStorage.getItem("hgDark")==="true"){
document.body.classList.add("dark");
}


/* CALCULADORA */

function calculator(){

document.getElementById("modalContent").innerHTML=`

<input id="calcDisplay"
class="calc-display"
readonly
value="0">

<div class="calc">

<button onclick="calcClear()">C</button>
<button onclick="calcBack()">⌫</button>
<button onclick="calcInput('%')">%</button>
<button class="operator" onclick="calcInput('/')">÷</button>

<button onclick="calcInput('7')">7</button>
<button onclick="calcInput('8')">8</button>
<button onclick="calcInput('9')">9</button>
<button class="operator" onclick="calcInput('*')">×</button>

<button onclick="calcInput('4')">4</button>
<button onclick="calcInput('5')">5</button>
<button onclick="calcInput('6')">6</button>
<button class="operator" onclick="calcInput('-')">−</button>

<button onclick="calcInput('1')">1</button>
<button onclick="calcInput('2')">2</button>
<button onclick="calcInput('3')">3</button>
<button class="operator" onclick="calcInput('+')">+</button>

<button onclick="calcInput('0')">0</button>
<button onclick="calcInput('.')">.</button>
<button style="grid-column:span 2" class="operator"
onclick="calcResult()">=</button>

</div>
`;

}

let calcExpression="";

function calcInput(value){

if(calcExpression==="Error") calcExpression="";

calcExpression+=value;

document.getElementById("calcDisplay").value=
calcExpression;

}

function calcClear(){

calcExpression="";

document.getElementById("calcDisplay").value="0";

}

function calcBack(){

calcExpression=calcExpression.slice(0,-1);

document.getElementById("calcDisplay").value=
calcExpression||"0";

}

function calcResult(){

try{

let expression=calcExpression.replace(/%/g,"/100");

if(!/^[0-9+\-*/().\s]+$/.test(expression)){
throw new Error();
}

let result=Function(
'"use strict";return ('+expression+')'
)();

calcExpression=String(result);

document.getElementById("calcDisplay").value=
calcExpression;

}catch{

calcExpression="Error";

document.getElementById("calcDisplay").value="Error";

}

}


/* PORCENTAJE */

function percentage(){

document.getElementById("modalContent").innerHTML=`

<div class="form-group">
<label>Valor</label>
<input id="percentValue" type="number" placeholder="Ej: 500">
</div>

<div class="form-group">
<label>Porcentaje (%)</label>
<input id="percentNumber" type="number" placeholder="Ej: 20">
</div>

<button class="primary-btn" onclick="calculatePercent()">
Calcular
</button>

<div class="result big" id="percentResult">Resultado</div>
`;

}

function calculatePercent(){

const value=parseFloat(document.getElementById("percentValue").value);
const percent=parseFloat(document.getElementById("percentNumber").value);

if(isNaN(value)||isNaN(percent)){

showToast("Completa los campos");

return;

}

document.getElementById("percentResult").textContent=
(value*percent/100).toLocaleString("es-CO");

}


/* DESCUENTO */

function discount(){

document.getElementById("modalContent").innerHTML=`

<div class="form-group">
<label>Precio original</label>
<input id="discountPrice" type="number" placeholder="100000">
</div>

<div class="form-group">
<label>Descuento (%)</label>
<input id="discountPercent" type="number" placeholder="20">
</div>

<button class="primary-btn" onclick="calculateDiscount()">
Calcular descuento
</button>

<div class="result" id="discountResult">
Resultado
</div>
`;

}

function calculateDiscount(){

const price=parseFloat(document.getElementById("discountPrice").value);
const percent=parseFloat(document.getElementById("discountPercent").value);

if(isNaN(price)||isNaN(percent))return;

const saving=price*percent/100;
const finalPrice=price-saving;

function ageCalculator(){

document.getElementById("modalContent").innerHTML=`

Edad

function calculateAge(){

const birth=new Date(document.getElementById("birthDate").value);

if(isNaN(birth))return;

const today=new Date();

let age=today.getFullYear()-birth.getFullYear();

const month=today.getMonth()-birth.getMonth();

if(month<0 ||
(month===0 && today.getDate()<birth.getDate())){

age--;

}

document.getElementById("ageResult").textContent=
age+" años";

}

function convertTemperature(){

let value=parseFloat(
document.getElementById("tempValue").value
);

let from=document.getElementById("tempFrom").value;

let to=document.getElementById("tempTo").value;

let celsius;

if(from==="C")celsius=value;

if(from==="F")celsius=(value-32)*5/9;

let result;

if(to==="C")result=celsius;

if(to==="F")result=celsius*9/5+32;

if(to==="K")result=celsius+273.15;

document.getElementById("tempResult").textContent=
result.toFixed(2);

}

/* CRONOMETRO */

let stopwatchInterval=null;
let stopwatchSeconds=0;

function stopwatch(){

document.getElementById("modalContent").innerHTML=`

<div class="timer"
id="stopwatchDisplay">
00:00:00
</div>

<div class="button-row"
style="justify-content:center">

<button class="primary-btn"
onclick="startStopwatch()">
▶ Iniciar
</button>

<button class="secondary-btn"
onclick="pauseStopwatch()">
⏸ Pausar
</button>

<button class="danger-btn"
onclick="resetStopwatch()">
↻ Reiniciar
</button>

</div>
`;

updateStopwatch();

}

function startStopwatch(){

if(stopwatchInterval)return;

stopwatchInterval=setInterval(()=>{

stopwatchSeconds++;

updateStopwatch();

},1000);

}

function pauseStopwatch(){

clearInterval(stopwatchInterval);

stopwatchInterval=null;

}

function resetStopwatch(){

pauseStopwatch();

stopwatchSeconds=0;

updateStopwatch();

}

function updateStopwatch(){

const h=Math.floor(stopwatchSeconds/3600);

const m=Math.floor(
(stopwatchSeconds%3600)/60
);

const s=stopwatchSeconds%60;

const display=
String(h).padStart(2,"0")+":"+
String(m).padStart(2,"0")+":"+
String(s).padStart(2,"0");

const el=document.getElementById("stopwatchDisplay");

if(el)el.textContent=display;

}


/* TEMPORIZADOR */

let timerInterval=null;
let timerSeconds=0;

function timer(){

document.getElementById("modalContent").innerHTML=`

<div class="row">

<div class="form-group">
<label>Minutos</label>
<input id="timerMinutes" type="number" min="0" value="1">
</div>

<div class="form-group">
<label>Segundos</label>
<input id="timerSeconds" type="number" min="0" max="59" value="0">
</div>

</div>

<div class="timer"
id="timerDisplay">
01:00
</div>

<div class="button-row"
style="justify-content:center">

<button class="primary-btn"
onclick="startTimer()">
▶ Iniciar
</button>

<button class="secondary-btn"
onclick="pauseTimer()">
⏸ Pausar
</button>

<button class="danger-btn"
onclick="resetTimer()">
↻ Reiniciar
</button>

</div>
`;

resetTimer();

}

function startTimer(){

if(timerInterval)return;

timerInterval=setInterval(()=>{

if(timerSeconds<=0){

clearInterval(timerInterval);

timerInterval=null;

showToast("⏰ ¡Tiempo terminado!");

return;

}

timerSeconds--;

updateTimer();

},1000);

}

function pauseTimer(){

clearInterval(timerInterval);

timerInterval=null;

}

function resetTimer(){

pauseTimer();

const minutes=parseInt(
document.getElementById("timerMinutes")?.value
)||0;

const seconds=parseInt(
document.getElementById("timerSeconds")?.value
)||0;

timerSeconds=minutes*60+seconds;

updateTimer();

}

function updateTimer(){

const el=document.getElementById("timerDisplay");

if(!el)return;

const m=Math.floor(timerSeconds/60);

const s=timerSeconds%60;

el.textContent=
String(m).padStart(2,"0")+":"+
String(s).padStart(2,"0");

}
